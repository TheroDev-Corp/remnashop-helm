apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "remnashop.fullname" . }}-config
  labels:
    {{- include "remnashop.labels" . | nindent 4 }}
data:
  APP_DOMAIN: {{ .Values.config.appDomain | quote }}
  APP_PORT: {{ .Values.config.appPort | quote }}
  APP_HOST: "0.0.0.0"
  
  LOG_TO_FILE: "false"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  
  REMNAWAVE_HOST: {{ .Values.config.remnawaveHost | quote }}
  
  DATABASE_HOST: {{ if .Values.config.databaseHost }}{{ .Values.config.databaseHost | quote }}{{ else }}{{ include "remnashop.fullname" . }}-db-rw{{ end }}
  DATABASE_PORT: {{ .Values.config.databasePort | quote }}
  DATABASE_NAME: {{ .Values.config.databaseName | quote }}
  DATABASE_USER: {{ .Values.config.databaseUser | quote }}
  
  REDIS_HOST: {{ include "remnashop.fullname" . }}-valkey
  REDIS_PORT: "6379"
  REDIS_NAME: "0"