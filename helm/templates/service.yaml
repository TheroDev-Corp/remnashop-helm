apiVersion: v1
kind: Service
metadata:
  name: {{ include "remnashop.fullname" . }}
  labels:
    {{- include "remnashop.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.config.appPort }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.config.metrics.enabled }}
    # Не публикуется через ingress: скрейп идёт изнутри кластера.
    - port: {{ .Values.config.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "remnashop.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: main-app