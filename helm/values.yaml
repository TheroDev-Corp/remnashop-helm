nameOverride: ""
fullnameOverride: ""

# Глобальные настройки бота
config:
  appDomain: "bot.example.com"
  appPort: 5000
  logLevel: "INFO"
  remnawaveHost: "http://remnaware-panel-backend.remnaware-namespace.svc.cluster.local:3000"

  databaseHost: ""
  databasePort: "5432"
  databaseName: "remnashop"
  databaseUser: "remnashop"

  # Экспорт метрик Prometheus (скрейпит VictoriaMetrics).
  # Порт отдельный от appPort и наружу не публикуется — авторизации нет намеренно.
  metrics:
    enabled: true
    port: 9100
    path: "/metrics"
    # TTL кэша бизнес-метрик, сек. Скрейп чаще TTL отдаёт закэшированные значения
    # и не дёргает тяжёлые агрегирующие запросы.
    cacheTtl: 45
    # Таймаут одного прохода сбора бизнес-метрик, сек.
    timeout: 25
    # Серии, дублирующие метрики самой панели (users_status / users_total):
    # remnashop_subscriptions по статусам и remnashop_users{state="total"}.
    # Считают только юзеров бота, поэтому скрыты по умолчанию — включите,
    # если хотите сравнивать обе стороны на одном графике.
    panelOverlap: false
    # Аннотации для скрейпа вешаются на Service: vmagent ходит по job
    # kubernetes-service-endpoints и читает prometheus.io/* именно с сервисов.
    serviceAnnotations: true
    # Дашборд Grafana (helm/dashboards/remnashop.json) в ConfigMap для сайдкара Grafana
    # из victoria-metrics-k8s-stack / kube-prometheus-stack.
    grafanaDashboard:
      enabled: true
      # Лейбл, по которому сайдкар ищет дашборды (sidecar.dashboards.label в чарте Grafana).
      labels:
        grafana_dashboard: "1"
      # Пусто — namespace релиза. Укажите namespace Grafana, если сайдкар ищет только в нём.
      namespace: ""
      # Например, папка в Grafana: grafana_folder: "Remnashop"
      annotations: {}
    # Под для `helm test`: проверяет, что экспортеры приложения и воркера отдают метрики.
    test:
      image: "busybox:1.36"

secrets:
  existingSecret: ""
  appCryptKey: "change_me_44_chars_base64_string="
  botToken: "1234567890:AAH_change_me"
  botSecretToken: "super_secret_webhook_token"
  botOwnerId: "123456789"
  botSupportUsername: "support_bot"
  remnawaveToken: "change_me"
  remnawaveWebhookSecret: "change_me"

  database:
    existingSecret: ""
    secretKey: "password"

# Основное приложение (FastAPI + Aiogram Webhook)
app:
  image:
    repository: ghcr.io/therodev-corp/remnashop-helm
    tag: v0.9.13
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 500m
      # Экспортер метрик — второй HTTP-сервер в процессе, запас под него.
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 256Mi


# Taskiq Worker (Фоновые задачи)
worker:
  replicaCount: 1
  # Количество процессов taskiq в одном поде. Держим 1: порт метрик может занять только
  # один процесс пода, при 2+ метрики выполнения задач второго процесса не экспортировались бы.
  # Параллелизм внутри процесса задаётся max-async-tasks, масштабирование — replicaCount.
  processes: 1
  metrics:
    # Воркер отдаёт runtime/БД/taskiq/Remnawave метрики на своём порту
    # через отдельный headless Service (без него endpointslices не появятся).
    # Бизнес-гейджи здесь выключены: это глобальные цифры из БД, и копия на каждую
    # реплику воркера только продублировала бы одно и то же число под разными лейблами.
    enabled: true
  resources:
    limits:
      cpu: 500m
      # Воркер и без экспортера держится у 456Mi; второй HTTP-сервер
      # добавляет немного, поэтому лимит поднят, чтобы не словить OOMKill.
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Taskiq Scheduler (Cron-задачи)
# Replica count always 1, because cron-tasks will be duplicated otherwise
scheduler:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Хранилище для баннеров и переводов
assets:
  persistence:
    enabled: true
    storageClass: "local-path" # Замени на свой, если нужно
    size: 1Gi
    accessMode: ReadWriteOnce

# Настройки Ingress
ingress:
  enabled: false
  className: "traefik"
  annotations: {}
  hosts:
    - host: bot.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# БД CloudNativePG
cnpg:
  enabled: true
  instances: 1
  storage:
    size: 5Gi
    storageClass: "local-path"
  backup:
    enabled: false
    bucketName: "remnashop-backups"
    endpointURL: "https://s3.amazonaws.com"
    existingSecret: "remnashop-backup-s3-creds"
    serverName: "remnashop-db"
    schedule: "0 0 3 * * *"
    retentionPolicy: "14d"

# Valkey (Кэш и Брокер Taskiq)
valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 9-alpine
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
